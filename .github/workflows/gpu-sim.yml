name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the `cuda`
# job in build.yml only compiles the CUDA paths. This builds them and runs the
# test suite, including the CPU-vs-GPU agreement test in test_registration, on
# a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim). A
# simulator cannot reproduce hardware-specific behavior or timing, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ctest:
    name: CTest (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@68edfd58c091361dd6baf060b63de412e544d858 # v0.1.7
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator runs PTX (90-virtual embeds PTX only) and needs a shared
      # CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DUSE_CUDA=ON -DBUILD_TESTING=ON \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DFLASHICP_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: cmake --build build -j3

      # test_registration exits 77 (a ctest skip) when no CUDA device is
      # found, so fail the job if anything was skipped.
      - name: Test
        run: |
          vgpu run ctest --test-dir build --output-on-failure --no-tests=error 2>&1 | tee ctest.log
          if grep -q "Skipped" ctest.log; then
            echo "a test was skipped (no CUDA device seen)"
            exit 1
          fi
